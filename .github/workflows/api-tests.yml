name: API Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Test Environment'
        required: false
        default: 'uat'
        type: choice
        options:
          - uat
          - staging
          - dev

jobs:
  # Stage 1: Code Validation & Linting
  stage-1-validate:
    name: 'Stage 1: Validate & Lint'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

  # Stage 2: API Test Execution
  stage-2-api-tests:
    name: 'Stage 2: Execute API Tests'
    needs: [stage-1-validate]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute API Tests
        env:
          TEST_ENV: ${{ inputs.environment || 'uat' }}
          BASE_URL: ${{ secrets.BASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: npm run test:api

      - name: Upload Raw Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-api-test-results
          path: test-results/
          retention-days: 1

  # Stage 3: Report & Artifact Archiving
  stage-3-report:
    name: 'Stage 3: Report & Artifacts'
    needs: [stage-2-api-tests]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download Test Results
        uses: actions/download-artifact@v4
        with:
          name: raw-api-test-results
          path: test-results/

      - name: Publish API Test Report
        uses: actions/upload-artifact@v4
        with:
          name: api-test-html-report
          path: |
            test-results/cucumber-report.html
            test-results/cucumber-report.json
          retention-days: 30
