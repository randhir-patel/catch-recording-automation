name: UI Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests on'
        required: false
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all
      environment:
        description: 'Test Environment'
        required: false
        default: 'uat'
        type: choice
        options:
          - uat
          - staging
          - dev

jobs:
  # Stage 1: Code Validation & Linting
  stage-1-validate:
    name: 'Stage 1: Validate & Lint'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

  # Stage 2: UI Test Execution
  stage-2-ui-tests:
    name: "Stage 2: Execute UI Tests (${{ inputs.browser || 'chromium' }})"
    needs: [stage-1-validate]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: 'Execute UI Tests (Single Browser)'
        if: ${{ inputs.browser != 'all' }}
        env:
          TEST_ENV: ${{ inputs.environment || 'uat' }}
          BASE_URL: ${{ secrets.BASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          HEADLESS: 'true'
          BROWSER: ${{ inputs.browser || 'chromium' }}
        run: npm run test:ui

      - name: 'Execute UI Tests (All Browsers - Chromium)'
        if: ${{ inputs.browser == 'all' }}
        env:
          TEST_ENV: ${{ inputs.environment || 'uat' }}
          BASE_URL: ${{ secrets.BASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          HEADLESS: 'true'
          BROWSER: 'chromium'
        run: npm run test:ui

      - name: 'Execute UI Tests (All Browsers - Firefox)'
        if: ${{ inputs.browser == 'all' }}
        env:
          TEST_ENV: ${{ inputs.environment || 'uat' }}
          BASE_URL: ${{ secrets.BASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          HEADLESS: 'true'
          BROWSER: 'firefox'
        run: npm run test:ui

      - name: 'Execute UI Tests (All Browsers - Webkit)'
        if: ${{ inputs.browser == 'all' }}
        env:
          TEST_ENV: ${{ inputs.environment || 'uat' }}
          BASE_URL: ${{ secrets.BASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          HEADLESS: 'true'
          BROWSER: 'webkit'
        run: npm run test:ui

      - name: Upload Raw Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-ui-test-results
          path: test-results/
          retention-days: 1

  # Stage 3: Report & Artifact Archiving
  stage-3-report:
    name: 'Stage 3: Report & Artifacts'
    needs: [stage-2-ui-tests]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download Test Results
        uses: actions/download-artifact@v4
        with:
          name: raw-ui-test-results
          path: test-results/

      - name: Publish UI Test Report
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-html-report
          path: |
            test-results/cucumber-report.html
            test-results/*.png
          retention-days: 30
